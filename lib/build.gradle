plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'schemaguard.SchemaGuardMain'
}

// 소스는 UTF-8로 저장되어 있다. 지정하지 않으면 Windows에서 MS949로 컴파일되어
// 한글 문자열 리터럴(콘솔 리포트)이 깨진다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8'
    systemProperty 'file.encoding', 'UTF-8'
}

dependencies {
    // Java 코드 파싱
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.5'

    // SQL 파싱
    implementation 'com.github.jsqlparser:jsqlparser:4.7'

    // 그래프 자료구조
    implementation 'org.jgrapht:jgrapht-core:1.5.2'

    // CLI
    implementation 'info.picocli:picocli:4.7.5'

    // JSON 리포트 출력
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // 테스트
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // 스냅샷 정답 파일 재생성: ./gradlew test --tests '*DeterminismTest*' -PupdateSnapshots=true
    systemProperty 'schemaguard.updateSnapshots', project.findProperty('updateSnapshots') ?: 'false'
    // 시스템 프로퍼티는 입력으로 취급되지 않으므로, 재생성 요청 시 up-to-date 로 건너뛰지 않게 한다.
    if (project.hasProperty('updateSnapshots')) {
        outputs.upToDateWhen { false }
    }
}

// Java 소스 파싱 벤치마크 (legacy: 파서별 파싱 vs shared: 파일당 1회 파싱)
//   ./gradlew benchmark
//   ./gradlew benchmark -PbenchArgs="--sizes 100,1000 --reps 5 --xmx 1g"
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Benchmarks Java source scanning on generated sample projects.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'schemaguard.bench.ParseBenchmark'
    def benchArgs = project.findProperty('benchArgs')
    if (benchArgs) {
        args benchArgs.toString().trim().split(/\s+/)
    }
}

// 규모별 그래프 생성/영향 분석 성능 (노드·엣지 수, 변경 수별 분석 시간)
//   ./gradlew scaleBenchmark
//   ./gradlew scaleBenchmark -PbenchArgs="--sizes 1000,5000 --changes 12,1000"
tasks.register('scaleBenchmark', JavaExec) {
    group = 'verification'
    description = 'Benchmarks graph building and impact analysis at increasing project sizes.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'schemaguard.bench.ScaleBenchmark'
    def benchArgs = project.findProperty('benchArgs')
    if (benchArgs) {
        args benchArgs.toString().trim().split(/\s+/)
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': 'schemaguard.SchemaGuardMain'
        )
    }
}